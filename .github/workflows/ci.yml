name: BlinkShip CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-services:
    name: Build & Test Backend Microservices
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics check_running"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      matrix:
        service:
          - eureka-server
          - config-server
          - auth-service
          - delivery-service
          - tracking-service
          - admin-service
          - api-gateway

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build & Run Unit Tests (${{ matrix.service }})
        run: |
          cd BlinkShip-Courier-Management-System-main/${{ matrix.service }}
          mvn clean test verify

  frontend:
    name: Build Frontend UI (Angular)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: BlinkShip-Courier-Management-System-main/courier-management-ui/package-lock.json

      - name: Install Dependencies
        run: |
          cd BlinkShip-Courier-Management-System-main/courier-management-ui
          npm ci

      - name: Build Angular App
        run: |
          cd BlinkShip-Courier-Management-System-main/courier-management-ui
          npm run build -- --configuration production
